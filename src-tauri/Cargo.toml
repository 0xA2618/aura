[package]
name = "aura"
version = "1.2.0"
description = "Aura IDE - Minimalist macOS Desktop Code Workspace"
authors = ["Yang"]
edition = "2021"

[lib]
name = "aura_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.8"
libc = "0.2"
tokio = { version = "1", features = ["full"] }
walkdir = "2"
open = "5"
which = "7"
notify = "6"

